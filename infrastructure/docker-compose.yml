services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-platform}
      POSTGRES_DB: ${POSTGRES_DB:-platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-platform}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.11.7
    command: ["-js"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    # No exec-based healthcheck: the image ships only the nats-server binary
    # (no shell, no wget/nc), so there's nothing to run one with. Consumers
    # wait on the client port being reachable instead (as the eventbus
    # integration test does via testcontainers' wait.ForListeningPort).

  # worker-1/2/3: three logical worker nodes per ADR-0009 — separate
  # processes, each with its own artificial capacity ceiling, all pointed at
  # this one host's real Docker daemon via the mounted socket (not isolated
  # hosts; see the ADR for what that does and doesn't prove). Only
  # apiserver/scheduler talk to Postgres — the worker doesn't, so no
  # depends_on: postgres here.
  worker-1:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      WORKER_HOSTNAME: worker-1
      WORKER_NATS_URL: nats://nats:4222
      WORKER_NODE_ID_FILE: /data/worker-node-id
      WORKER_CPU_CAPACITY_MILLICORES: 2000
      WORKER_MEMORY_CAPACITY_MB: 2048
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker-1-data:/data
    ports:
      - "${WORKER_1_PORT:-7101}:7100"
    depends_on:
      - nats

  worker-2:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      WORKER_HOSTNAME: worker-2
      WORKER_NATS_URL: nats://nats:4222
      WORKER_NODE_ID_FILE: /data/worker-node-id
      WORKER_CPU_CAPACITY_MILLICORES: 1000
      WORKER_MEMORY_CAPACITY_MB: 1024
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker-2-data:/data
    ports:
      - "${WORKER_2_PORT:-7102}:7100"
    depends_on:
      - nats

  worker-3:
    build:
      context: ..
      dockerfile: services/worker/Dockerfile
    environment:
      WORKER_HOSTNAME: worker-3
      WORKER_NATS_URL: nats://nats:4222
      WORKER_NODE_ID_FILE: /data/worker-node-id
      WORKER_CPU_CAPACITY_MILLICORES: 3000
      WORKER_MEMORY_CAPACITY_MB: 3072
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - worker-3-data:/data
    ports:
      - "${WORKER_3_PORT:-7103}:7100"
    depends_on:
      - nats

volumes:
  postgres-data:
  worker-1-data:
  worker-2-data:
  worker-3-data:
